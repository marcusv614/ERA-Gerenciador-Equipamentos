name: Publicar imagens de producao

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguranca:
    name: Validar antes de publicar
    uses: ./.github/workflows/verificar-seguranca.yml
  publicar:
    needs: seguranca
    name: Publicar ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: Backend/API
            image: ghcr.io/marcusv614/era-gerenciador-equipamentos-api
            cache_scope: era-api
          - name: UI
            context: Frontend/UI
            image: ghcr.io/marcusv614/era-gerenciador-equipamentos-ui
            cache_scope: era-ui
    steps:
      - name: Baixar codigo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir imagem para verificacao
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Verificar a imagem exata que sera publicada
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          version: v0.76.1
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          timeout: 10m

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar somente as imagens verificadas
        env:
          IMAGE: ${{ matrix.image }}
          REVISAO: ${{ github.sha }}
        run: |
          docker push "${IMAGE}:${REVISAO}"
          docker push "${IMAGE}:latest"
