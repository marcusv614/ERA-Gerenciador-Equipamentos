name: era-erp

services:
  database:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-era_erp}
      POSTGRES_USER: ${POSTGRES_USER:-era}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: ${APP_TIMEZONE:-America/Manaus}
    volumes:
      - postgres16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [era_network]

  api:
    image: ${API_IMAGE:-ghcr.io/marcusv614/era-gerenciador-equipamentos-api:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-era_erp}
      DB_USERNAME: ${POSTGRES_USER:-era}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_APP_URL:?Defina PUBLIC_APP_URL com a URL HTTPS pública}
      ADMIN_INITIAL_NAME: ${ADMIN_INITIAL_NAME:-Administrador ERA}
      ADMIN_INITIAL_LOGIN: ${ADMIN_INITIAL_LOGIN:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Defina ADMIN_INITIAL_PASSWORD no arquivo .env}
      SESSION_COOKIE_SECURE: "true"
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      TZ: ${APP_TIMEZONE:-America/Manaus}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${APP_TIMEZONE:-America/Manaus}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [era_network]

  ui:
    image: ${UI_IMAGE:-ghcr.io/marcusv614/era-gerenciador-equipamentos-ui:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.era-erp-ui.rule=Host(`${APP_DOMAIN:?Defina APP_DOMAIN no arquivo .env}`)
      - traefik.http.routers.era-erp-ui.entrypoints=websecure
      - traefik.http.routers.era-erp-ui.tls=true
      - traefik.http.routers.era-erp-ui.tls.certresolver=letsencrypt
      - traefik.http.routers.era-erp-ui.service=era-erp-ui
      - traefik.http.services.era-erp-ui.loadbalancer.server.port=80
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [era_network]

volumes:
  postgres16_data:

networks:
  era_network:
    driver: bridge
