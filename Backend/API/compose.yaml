services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: era_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - era_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d era_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  era_postgres_data:
