spring.application.name=era-api
spring.jackson.deserialization.accept-float-as-int=false
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/era_erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Manaus

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# SMTP é auxiliar: Gmail não configurado/indisponível não pode bloquear a API e a UI.
# Os demais indicadores (incluindo banco) continuam ativos; falhas de envio são tratadas pelo serviço.
management.health.mail.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.bootstrap.admin.nome=${ADMIN_INITIAL_NAME:Administrador ERA}
app.bootstrap.admin.login=${ADMIN_INITIAL_LOGIN:}
app.bootstrap.admin.senha=${ADMIN_INITIAL_PASSWORD:}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB

# Desabilitado até configurar o remetente; nunca usar a senha pessoal do Gmail.
app.recuperacao.habilitada=${RECOVERY_ENABLED:false}
app.recuperacao.url-publica=${RECOVERY_PUBLIC_URL:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
